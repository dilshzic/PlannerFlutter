flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  image_path: "assets/icons/app_icon_dark.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon_monochrome.png"
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.png"
  image_path_ios_dark_transparent: "assets/icons/app_icon_monochrome_white.png"
  image_path_ios_tinted_transparent: "assets/icons/app_icon_monochrome.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon_dark.png"
    background_color: "#ffffff"
    theme_color: "#1E293B"
  windows:
    generate: true
    image_path: "assets/icons/app_icon_dark.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/app_icon_dark.png"


